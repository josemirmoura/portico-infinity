# Explicit operator opt-in: persistently delegate only /home and /opt.
# Always combine with compose.yaml and the existing authentication overlay.
services:
  broker:
    environment:
      VPS_AGENT_PHYSICAL_SCOPE_ROOTS: '["/home","/opt"]'
      VPS_AGENT_WHOLE_HOST: "0"
      VPS_AGENT_INFINITY_FILECOPY_JOBS: "0"
    volumes:
      - type: bind
        source: /home
        target: /host/home
        read_only: false
        bind:
          propagation: rslave
          create_host_path: false
