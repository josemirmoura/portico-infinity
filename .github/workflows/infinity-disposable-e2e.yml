name: infinity-real-docker-disposable-e2e

on:
  pull_request:
    paths:
      - 'internal/broker/**'
      - 'tests/integration/infinity-docker-probe/**'
      - '.github/workflows/infinity-disposable-e2e.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/infinity-disposable-e2e.yml'
      - 'tests/integration/infinity-docker-probe/**'
      - 'internal/broker/**'
      - 'internal/gateway/**'
      - 'internal/securefs/**'
      - 'scripts/infinity-emergency-stop.py'
      - 'scripts/configure-infinity-opt.py'
      - 'scripts/check-infinity-layout.py'
      - 'compose.yaml'
      - 'config/policy.example.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinity-disposable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-real-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Preflight exact ephemeral runner and clean controller
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test ! -e /srv/portico-infinity
          test ! -L /srv/portico-infinity
          docker compose version
          go mod download
          docker ps -aq --filter label=com.docker.compose.project=portico-infinity --format '{{.ID}}' | grep -q . && {
            echo 'E2E BLOCKED: Infinity resources already exist on runner' >&2
            exit 1
          } || test "${PIPESTATUS[0]}" -eq 0

      - name: Prepare protected controller and /opt proof directory
        shell: bash
        env:
          INFINITY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin portico-infinity-exec
          sudo install -d -o root -g root -m 0755 /srv/portico-infinity
          sudo cp -a "$GITHUB_WORKSPACE"/. /srv/portico-infinity/
          sudo chown -R root:root /srv/portico-infinity
          sudo chmod -R go-w /srv/portico-infinity
          # This proof directory is the ONLY /opt resource created for this E2E.
          sudo install -d -o portico-infinity-exec -g portico-infinity-exec -m 0755 "/opt/infinity-e2e-${INFINITY_RUN_ID}"
          cd /srv/portico-infinity
          sudo python3 scripts/check-infinity-layout.py --run-as portico-infinity-exec
          if sudo -u portico-infinity-exec test -w /srv/portico-infinity; then
            echo 'E2E SECURITY FAILURE: shell user can write controller' >&2
            exit 1
          fi

      - name: Initialize actual scoped policy and isolated Compose instance
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/portico-infinity
          sudo env VPS_AGENT_LANG=pt-BR VPS_AGENT_LANG_EXPLICIT=1 bash scripts/init.sh             --scope /opt --run-as portico-infinity-exec --lang pt-BR
          sudo python3 scripts/configure-infinity-opt.py --env .env --policy config/policy.yaml
          sudo python3 - <<'PY'
          from pathlib import Path
          p=Path(".env")
          values={
            "COMPOSE_PROJECT_NAME":"portico-infinity",
            "VPS_AGENT_INSTANCE_NAME":"portico-infinity",
            "VPS_AGENT_INFINITY_PROTECTED_ROOT":"/srv/portico-infinity",
            "VPS_AGENT_PORT":"18081",
            "VPS_AGENT_AUTH_MODE":"static",
            "VPS_AGENT_GATEWAY_IMAGE":"portico-infinity-gateway:e2e",
            "VPS_AGENT_BROKER_IMAGE":"portico-infinity-broker:e2e",
          }
          lines=p.read_text().splitlines()
          out=[]
          seen=set()
          for line in lines:
            key=line.partition("=")[0]
            if key in values:
              if key in seen:
                raise SystemExit("duplicate Infinity key")
              out.append(key+"="+values[key])
              seen.add(key)
            else:
              out.append(line)
          out += [k+"="+v for k,v in values.items() if k not in seen]
          p.write_text("\n".join(out)+"\n")
          p.chmod(0o600)
          PY
          sudo python3 scripts/check-infinity-layout.py --run-as portico-infinity-exec
          sudo docker compose -p portico-infinity config --quiet

      - name: Start REAL Docker Broker and Gateway on ephemeral host
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/portico-infinity
          sudo docker compose -p portico-infinity up -d --build broker gateway
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            sudo docker compose -p portico-infinity ps
            sudo docker compose -p portico-infinity logs --tail=100 broker gateway
            echo 'E2E FAILED: real Docker Gateway/Broker not healthy' >&2
            exit 1
          fi
          sudo python3 scripts/infinity-emergency-stop.py --dry-run

      - name: Real MCP filesystem, scope denial, static token and audit
        shell: bash
        env:
          INFINITY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TOKEN="$(sudo sed -n 's/^VPS_AGENT_STATIC_TOKEN=//p' /srv/portico-infinity/.env)"
          test "${#TOKEN}" -ge 40
          echo "::add-mask::$TOKEN"
          export INFINITY_E2E_BEARER_TOKEN="$TOKEN"
          go run ./tests/integration/infinity-docker-probe             --directory "/opt/infinity-e2e-${INFINITY_RUN_ID}"             --output "$RUNNER_TEMP/infinity-real-docker-evidence.json"
          sudo test ! -e /etc/portico-infinity-escape.txt
          sudo test -f /srv/portico-infinity/config/policy.yaml
          sudo grep -q '^mode: scoped$' /srv/portico-infinity/config/policy.yaml
          sudo grep -q 'full_mode_enabled: false' /srv/portico-infinity/config/policy.yaml
          cd /srv/portico-infinity
          sudo docker compose -p portico-infinity exec -T broker             /usr/local/bin/vps-agent audit-status --socket /run/vps-agent/broker.sock

      - name: Real emergency stop, verification and restart
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/portico-infinity
          sudo python3 scripts/infinity-emergency-stop.py --execute
          if curl --connect-timeout 2 -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
            echo 'E2E FAILURE: Gateway remained online after owner emergency stop' >&2
            exit 1
          fi
          # Restart only the scoped Infinity project, check persisted policy.
          sudo docker compose -p portico-infinity up -d broker gateway
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          sudo python3 scripts/check-infinity-layout.py --run-as portico-infinity-exec
          echo 'INFINITY REAL DOCKER E2E COMPLETE: scoped controller, operations, audit, stop and restart'

      - name: Upload nonsecret lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infinity-real-docker-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/infinity-real-docker-evidence.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup only this ephemeral Infinity project
        if: always()
        shell: bash
        env:
          INFINITY_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          if [ -d /srv/portico-infinity ]; then
            cd /srv/portico-infinity
            sudo docker compose -p portico-infinity down --remove-orphans
          fi
          if [ -d "/opt/infinity-e2e-${INFINITY_RUN_ID}" ]; then
            sudo rmdir "/opt/infinity-e2e-${INFINITY_RUN_ID}" 2>/dev/null || true
          fi
