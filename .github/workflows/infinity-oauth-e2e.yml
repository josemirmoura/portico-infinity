            test ! -e backups
            bash scripts/prepare-https-introspection.sh --apply
            grep -qx 'VPS_AGENT_INTEGRATED_INTROSPECTION_URL=https://mcp.example.invalid/oauth/v2/introspect' .env
            test "$(stat -c %a .env)" = 600
            backup="$(find backups -type f -name previous.env -print -quit)"
            test -n "$backup"
            test "$(stat -c %a "$backup")" = 600
            test "$(stat -c %a "$(dirname "$backup")")" = 700
            cmp -s "$backup" "$lab/original-legacy.env"
            test "$(sha256sum state/sentinel | cut -d ' ' -f1)" = "$state_hash"
            # No restart, no identity volume change. Test operator-controlled
            # byte-exact rollback of the legacy config from private backup.
            cp -p -- "$backup" .env
            cmp -s .env "$lab/original-legacy.env"
            test "$(stat -c %a .env)" = 600
          )
          echo "GATE_C_REAL_ZITADEL_ENV_MIGRATION_RESTORE_OK (config backup only; not signed-RC rollback)"



          # Single-path disposable E2E: ZITADEL real -> trusted HTTPS
          # -> distributed Gateway -> Unix peer-credential IPC -> real Broker
          # -> Scoped filesystem + audit. No host root or Docker socket.
          mkdir -p "$lab/socket" "$lab/broker-state" "$lab/scope"
