          docker rm -f portico-ci-real-gateway >/dev/null
          echo "Real distributed Gateway + real ZITADEL introspection via trusted HTTPS: PASS (local nonprivileged executor; Broker proof separate)"

          # Migrator against the same real in-network ZITADEL HTTPS endpoint.
