          cat > "$lab/gateway-probe.py" <<'PY'
          import json, time, urllib.error, urllib.request

          token=json.load(open("/pki/probe-token.json",encoding="utf-8"))["access_token"]
          base="http://portico-ci-real-gateway:8080"
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          payload=json.dumps({
              "jsonrpc":"2.0", "id":7, "method":"tools/call",
              "params":{
                  "name":"system.info", "arguments":{},
                  "_meta":{
                      "io.modelcontextprotocol/protocolVersion":"2026-07-28",
                      "io.modelcontextprotocol/clientInfo":{"name":"real-idp-disposable","version":"1"},
                      "io.modelcontextprotocol/clientCapabilities":{}
                  }
              }
          }).encode()
          def call(bearer=None):
              headers={
                  "Content-Type":"application/json",
                  "Accept":"application/json, text/event-stream",
                  "MCP-Protocol-Version":"2026-07-28",
                  "Mcp-Method":"tools/call",
                  "Mcp-Name":"system.info",
              }
              if bearer is not None:
                  headers["Authorization"]="Bearer "+bearer
              return urllib.request.Request(base+"/mcp",data=payload,headers=headers,method="POST")
          response=None
          for attempt in range(45):
              try:
                  response=opener.open(call(token),timeout=5)
                  break
              except (urllib.error.URLError, OSError):
                  if attempt==44:
                      raise
                  time.sleep(1)
          with response as authenticated:
