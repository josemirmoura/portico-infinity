name: infinity-real-oauth-disposable-acceptance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/infinity-oauth-e2e.yml'
      - 'tests/integration/infinity-oauth-filecopy-probe.py'
      - 'tests/integration/infinity-oauth-filecopy-revocation.sh'
      - 'scripts/infinity-revoke-filecopy-subject.py'
  pull_request:
    paths:
      - '.github/workflows/infinity-oauth-e2e.yml'
      - 'tests/integration/infinity-oauth-filecopy-probe.py'
      - 'tests/integration/infinity-oauth-filecopy-revocation.sh'
      - 'scripts/infinity-revoke-filecopy-subject.py'
  workflow_dispatch:

permissions:
  contents: read

# Disjoint OAuth identity and database volumes, NEVER Community project.
env:
  COMPOSE_PROJECT_NAME: portico-infinity-oauth

jobs:
  infinity-real-oauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Gate C A1 migration preflight and rollback-safe config unit tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/prepare-https-introspection.sh
          bash -n scripts/setup-integrated-auth.sh
          bash -n scripts/verify-public.sh
          python3 -m unittest discover -s tests/scripts -p 'test_prepare_https_introspection.py' -v
          python3 -m unittest discover -s tests/scripts -p 'test_zitadel_session_cookie_contract.py' -v

      - name: Prepare isolated identity stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vps-agent-auth-ci state
          cp config/policy.example.yaml config/policy.yaml
          docker network create ci-edge

          ADMIN_TOKEN="$(openssl rand -hex 32)"
          STATIC_TOKEN="$(openssl rand -hex 32)"
          MASTER_KEY="$(openssl rand -hex 16)"
          DB_SECRET="$(openssl rand -hex 24)"
          BOOTSTRAP_SECRET="T1!$(openssl rand -hex 18)"
          OPERATOR_SECRET="T2!$(openssl rand -hex 18)"
          COOKIE_SECRET="$(openssl rand -hex 32)"
          {
            echo "VPS_AGENT_ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "VPS_AGENT_STATIC_TOKEN=$STATIC_TOKEN"
            echo "VPS_AGENT_SUBJECT=ci-placeholder"
            echo "VPS_AGENT_INSTANCE_ID=ci-integrated-auth"
            echo "VPS_AGENT_INSTANCE_NAME=ci-integrated-auth"
            echo "VPS_AGENT_SCOPE_ROOT=/tmp/vps-agent-auth-ci"
            echo "VPS_AGENT_WHOLE_HOST=0"
            echo "VPS_AGENT_AUTH_MODE=integrated"
            echo "VPS_AGENT_DOMAIN=mcp.example.invalid"
            echo "VPS_AGENT_PUBLIC_URL=https://mcp.example.invalid/mcp"
            echo "VPS_AGENT_OIDC_ISSUER=https://mcp.example.invalid"
            echo "VPS_AGENT_OAUTH_RESOURCE=https://mcp.example.invalid/mcp"
            echo "VPS_AGENT_RESOURCE_METADATA_URL=https://mcp.example.invalid/.well-known/oauth-protected-resource"
            echo "VPS_AGENT_REQUIRED_SCOPES=openid"
            echo "VPS_AGENT_EDGE_NETWORK=ci-edge"
            echo "VPS_AGENT_TRAEFIK_CERTRESOLVER=letsencrypt"
            echo "VPS_AGENT_BUNDLED_PROXY=0"
            echo "ZITADEL_VERSION=v4.19.4"
            echo "ZITADEL_SESSION_COOKIE_SECRET=$COOKIE_SECRET"
            echo "ZITADEL_MASTERKEY=$MASTER_KEY"
            echo "ZITADEL_POSTGRES_DB=zitadel"
            echo "ZITADEL_POSTGRES_USER=zitadel"
            echo "ZITADEL_POSTGRES_PASSWORD=$DB_SECRET"
            echo "ZITADEL_BOOTSTRAP_ADMIN_PASSWORD=$BOOTSTRAP_SECRET"
            echo "ZITADEL_BOOTSTRAP_PAT_EXPIRATION=2099-01-01T00:00:00Z"
            echo "ZITADEL_LOGIN_PAT_EXPIRATION=2099-01-01T00:00:00Z"
            echo "CI_OPERATOR_SECRET=$OPERATOR_SECRET"
          } > .env
          chmod 600 .env config/policy.yaml

      - name: Start ZITADEL, Login UI and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE=(docker compose -f compose.yaml -f compose.integrated-auth.yaml)
          "${COMPOSE[@]}" up -d zitadel-postgres zitadel-api zitadel-login
          for _ in $(seq 1 120); do
            api_id="$("${COMPOSE[@]}" ps -q zitadel-api)"
            login_id="$("${COMPOSE[@]}" ps -q zitadel-login)"
            api_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$api_id" 2>/dev/null || true)"
            login_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$login_id" 2>/dev/null || true)"
            if [ "$api_status" = healthy ] && [ "$login_status" = healthy ]; then
              # Assert dedicated session signing secret without exposing its bytes.
              "${COMPOSE[@]}" exec -T zitadel-login node -e \
                'if ((process.env.ZITADEL_SESSION_COOKIE_SECRET || "").length < 32) process.exit(1)'
              "${COMPOSE[@]}" ps
              exit 0
            fi
            sleep 2
          done
          "${COMPOSE[@]}" logs --no-color zitadel-api zitadel-login zitadel-postgres
          exit 1

      - name: Enable DCR and create operator through real ZITADEL API
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          PAT="$(docker run --rm -v portico-infinity-oauth_zitadel-bootstrap:/zitadel/bootstrap:ro alpine:3.22 cat /zitadel/bootstrap/bootstrap-admin.pat)"
          test -n "$PAT"
          echo "::add-mask::$PAT"

          curl_ci() {
            docker run --rm -i --network ci-edge curlimages/curl:8.16.0               -fsS               -H 'Host: mcp.example.invalid'               -H 'X-Forwarded-Proto: https'               "$@"
          }

          curl_ci http://zitadel-api:8080/.well-known/openid-configuration > /tmp/oidc-before.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/oidc-before.json'))
          assert x['issuer'] == 'https://mcp.example.invalid', x
          print('OIDC DISCOVERY: PASS')
          PY

          curl_ci             -X PUT http://zitadel-api:8080/v2/settings/security             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{"dynamicClientRegistration":{"enabled":true,"allowUnauthenticated":true}}'             > /tmp/security.json

          python3 - "$CI_OPERATOR_SECRET" <<'PY' > /tmp/operator.json
          import json,sys
          print(json.dumps({
            "userId":"ci-operator-001",
            "username":"ci-operator",
            "profile":{"givenName":"CI","familyName":"Operator","displayName":"CI Operator","preferredLanguage":"en"},
            "email":{"email":"ci-operator@example.invalid","isVerified":True},
            "password":{"password":sys.argv[1],"changeRequired":False},
          }))
          PY

          curl_ci             -X POST http://zitadel-api:8080/v2/users/human             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data-binary @-             < /tmp/operator.json             > /tmp/operator-response.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/operator-response.json'))
          assert x.get('userId') == 'ci-operator-001', x
          print('DEDICATED OPERATOR: PASS')
          PY

          # Separate crash-recovery scenario: one planned UUID, real ZITADEL
          # GET 404 before POST, then GET 200 on a resumed installer run.
          umask 077
          RECOVERY_DIR="$(mktemp -d "$RUNNER_TEMP/portico-oauth-recovery.XXXXXXXX")"
          chmod 700 "$RECOVERY_DIR"
          RECOVERY_JOURNAL="$RECOVERY_DIR/oauth-operator-create.json"
          RECOVERY_MARKER="$RECOVERY_DIR/integrated-auth.json"
          RECOVERY_ID="$(python3 scripts/oauth-operator-reconcile.py prepare "$RECOVERY_JOURNAL" \
            mcp.example.invalid ci-recovery ci-recovery@example.invalid)"
          get_recovery_user() {
            docker run --rm -i --network ci-edge curlimages/curl:8.16.0 \
              -sS -H "Host: mcp.example.invalid" -H "X-Forwarded-Proto: https" \
              -H "Authorization: Bearer $PAT" \
              --write-out '\n__PORTICO_HTTP_STATUS__%{http_code}' \
              "http://zitadel-api:8080/v2/users/$RECOVERY_ID" >"$RECOVERY_DIR/lookup.txt"
            python3 scripts/oauth-operator-reconcile.py probe "$RECOVERY_DIR/lookup.txt" \
              "$RECOVERY_ID" ci-recovery ci-recovery@example.invalid
          }
          test "$(get_recovery_user)" = "ABSENT"
          python3 - "$RECOVERY_ID" <<'PY' >"$RECOVERY_DIR/create-body.json"
          import json,os,sys
          print(json.dumps({
            "userId":sys.argv[1], "username":"ci-recovery",
            "profile":{"givenName":"CI","familyName":"Recovery",
                       "displayName":"CI Recovery","preferredLanguage":"en"},
            "email":{"email":"ci-recovery@example.invalid","isVerified":True},
            "password":{"password":os.environ["CI_OPERATOR_SECRET"],"changeRequired":False}
          }))
          PY
          curl_ci -X POST http://zitadel-api:8080/v2/users/human \
            -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" \
            --data-binary @- <"$RECOVERY_DIR/create-body.json" >"$RECOVERY_DIR/create-response.json"
          python3 - "$RECOVERY_DIR/create-response.json" "$RECOVERY_ID" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1])).get("userId")==sys.argv[2]
          PY
          # Simulate crash after HTTP 200 but BEFORE .env or marker commit.
          test "$(python3 scripts/oauth-operator-reconcile.py prepare "$RECOVERY_JOURNAL" \
            mcp.example.invalid ci-recovery ci-recovery@example.invalid)" = "$RECOVERY_ID"
          test "$(get_recovery_user)" = "FOUND"
          python3 - "$RECOVERY_MARKER" "$RECOVERY_ID" <<'PY'
          import json,sys
          with open(sys.argv[1],"w") as stream:
              json.dump({"domain":"mcp.example.invalid","subject":sys.argv[2],
                         "username":"ci-recovery","email":"ci-recovery@example.invalid"},stream)
          PY
          python3 scripts/oauth-operator-reconcile.py finalize \
            "$RECOVERY_JOURNAL" "$RECOVERY_MARKER" "$RECOVERY_ID"
          test ! -e "$RECOVERY_JOURNAL"
          echo "REAL ZITADEL OPERATOR CRASH RECOVERY: PASS"

          curl_ci             -X POST http://zitadel-api:8080/management/v1/projects             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{"name":"MCP VPS Agent Resource CI"}'             > /tmp/resource-project.json
          RESOURCE_PROJECT_ID="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/resource-project.json'))
          value=x.get('id','')
          assert value, x
          print(value)
          PY
          )"
          test -n "$RESOURCE_PROJECT_ID"

          curl_ci             -X POST "http://zitadel-api:8080/management/v1/projects/$RESOURCE_PROJECT_ID/apps/api"             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{"name":"MCP VPS Agent Introspector CI","authMethodType":"API_AUTH_METHOD_TYPE_BASIC"}'             > /tmp/introspection-app.json
          readarray -t INTROSPECTION_VALUES < <(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/introspection-app.json'))
          for key in ('appId','clientId','clientSecret'):
              value=x.get(key,'')
              assert value, x
              print(value)
          PY
          )
          test "${#INTROSPECTION_VALUES[@]}" -eq 3
          INTROSPECTION_CLIENT_ID="${INTROSPECTION_VALUES[1]}"
          INTROSPECTION_CLIENT_SECRET="${INTROSPECTION_VALUES[2]}"
          echo "::add-mask::$INTROSPECTION_CLIENT_SECRET"

          curl_ci             -X POST http://zitadel-api:8080/oauth/v2/introspect             -u "$INTROSPECTION_CLIENT_ID:$INTROSPECTION_CLIENT_SECRET"             -H 'Content-Type: application/x-www-form-urlencoded'             --data 'token=deliberately-invalid-component-probe'             > /tmp/introspection-probe.json
          python3 - "$RESOURCE_PROJECT_ID" <<'PY'
          import json,sys
          project=sys.argv[1]
          x=json.load(open('/tmp/introspection-probe.json'))
          assert x.get('active') is False, x
          scope=f"urn:zitadel:iam:org:project:id:{project}:aud"
          assert scope.endswith(':aud')
          print('AUDIENCE RESOURCE + PRIVATE INTROSPECTION CLIENT: PASS')
          PY

          # Prove ZITADEL actually places the dedicated resource project in aud
          # and that the resource API client can introspect that token.
          curl_ci             -X POST http://zitadel-api:8080/management/v1/users/machine             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{"userName":"ci-resource-probe","name":"CI Resource Probe","description":"audience acceptance probe","accessTokenType":"ACCESS_TOKEN_TYPE_BEARER"}'             > /tmp/probe-machine.json
          PROBE_USER_ID="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/probe-machine.json'))
          value=x.get('userId','')
          assert value, x
          print(value)
          PY
          )"

          curl_ci             -X PUT "http://zitadel-api:8080/management/v1/users/$PROBE_USER_ID/secret"             -H "Authorization: Bearer $PAT"             -H 'Content-Type: application/json'             --data '{}'             > /tmp/probe-secret.json
          readarray -t PROBE_CREDS < <(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/probe-secret.json'))
          for key in ('clientId','clientSecret'):
              value=x.get(key,'')
              assert value, x
              print(value)
          PY
          )
          PROBE_CLIENT_ID="${PROBE_CREDS[0]}"
          PROBE_CLIENT_SECRET="${PROBE_CREDS[1]}"
          echo "::add-mask::$PROBE_CLIENT_SECRET"

          AUDIENCE_SCOPE="urn:zitadel:iam:org:project:id:$RESOURCE_PROJECT_ID:aud"
          curl_ci             -X POST http://zitadel-api:8080/oauth/v2/token             -u "$PROBE_CLIENT_ID:$PROBE_CLIENT_SECRET"             -H 'Content-Type: application/x-www-form-urlencoded'             --data 'grant_type=client_credentials'             --data-urlencode "scope=openid $AUDIENCE_SCOPE"             > /tmp/probe-token.json
          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/probe-token.json'))
          value=x.get('access_token','')
          assert value, x
          print(value)
          PY
          )"
          echo "::add-mask::$ACCESS_TOKEN"

          curl_ci             -X POST http://zitadel-api:8080/oauth/v2/introspect             -u "$INTROSPECTION_CLIENT_ID:$INTROSPECTION_CLIENT_SECRET"             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode "token=$ACCESS_TOKEN"             > /tmp/probe-token-introspection.json
          python3 - "$RESOURCE_PROJECT_ID" "$AUDIENCE_SCOPE" <<'PY'
          import json,sys,time
          project,required_scope=sys.argv[1:]
          x=json.load(open('/tmp/probe-token-introspection.json'))
          aud=x.get('aud',[])
          if isinstance(aud,str):
              aud=[aud]
          assert x.get('active') is True, x
          assert project in aud, (project,aud)
          assert required_scope in x.get('scope','').split(), x
          assert x.get('sub'), x
          assert int(x.get('exp',0)) > int(time.time()), x
          assert x.get('iss') == 'https://mcp.example.invalid', x
          print('REAL AUDIENCE-BOUND TOKEN INTROSPECTION: PASS')
          PY

          curl_ci http://zitadel-api:8080/.well-known/openid-configuration > /tmp/oidc-after.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/oidc-after.json'))
          assert x.get('registration_endpoint'), x
          assert 'S256' in x.get('code_challenge_methods_supported',[]), x
          assert 'offline_access' in x.get('scopes_supported',[]), x
          assert 'authorization_code' in x.get('grant_types_supported',[]), x
          assert 'refresh_token' in x.get('grant_types_supported',[]), x
          assert 'none' in x.get('token_endpoint_auth_methods_supported',[]), x
          print('DCR + PKCE + REFRESH DISCOVERY: PASS')
          PY

          curl_ci             -X POST http://zitadel-api:8080/oauth/v2/register             -H 'Content-Type: application/json'             --data '{"client_name":"CI MCP Client","redirect_uris":["https://example.com/callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none"}'             > /tmp/dcr-client.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/dcr-client.json'))
          assert x.get('client_id'), x
          assert x.get('registration_access_token'), x
          print('REAL DYNAMIC CLIENT REGISTRATION: PASS')
          PY

      - name: Gate C real ZITADEL introspection through verified isolated Traefik TLS
        shell: bash
        run: |
          set -euo pipefail
          lab="$(mktemp -d /tmp/portico-zitadel-https.XXXXXXXX)"
          chmod 700 "$lab"
          trap 'COMPOSE_PROJECT_NAME=portico-gate-c-migration docker compose -f "$lab/migrate/compose.yaml" -f "$lab/migrate/compose.integrated-auth.yaml" --project-directory "$lab/migrate" down -v --remove-orphans >/dev/null 2>&1 || true; docker rm -f portico-ci-e2e-gateway portico-ci-e2e-broker portico-ci-real-gateway portico-ci-zitadel-tls >/dev/null 2>&1 || true; sudo rm -rf -- "$lab"' EXIT

          # No host-published ports, Docker socket, operator credentials or external
          # mounts. Reuse only the already disposable ZITADEL/Postgres CI network.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$lab/ca.key" -out "$lab/ca.pem" \
            -subj '/CN=Portico Disposable CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$lab/server.key" -out "$lab/server.csr" \
            -subj '/CN=mcp.example.invalid' >/dev/null 2>&1
          printf 'subjectAltName=DNS:mcp.example.invalid\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > "$lab/server.ext"
          openssl x509 -req -in "$lab/server.csr" -CA "$lab/ca.pem" \
            -CAkey "$lab/ca.key" -CAcreateserial -out "$lab/server.pem" \
            -days 1 -extfile "$lab/server.ext" >/dev/null 2>&1
          chmod 600 "$lab/"*.key
          cat > "$lab/traefik.yml" <<'YAML'
          http:
            routers:
              introspection:
                rule: 'Host("mcp.example.invalid") && Path("/oauth/v2/introspect")'
                entryPoints: [secure]
                service: real-zitadel
                tls: {}
            services:
              real-zitadel:
                loadBalancer:
                  servers:
                    - url: "h2c://zitadel-api:8080"
          tls:
            certificates:
              - certFile: /pki/server.pem
                keyFile: /pki/server.key
          YAML
          cp /tmp/introspection-app.json "$lab/introspection-app.json"
          cp /tmp/probe-token.json "$lab/probe-token.json"
          chmod 600 "$lab/"*.json

          # File-provider only. No Docker API, privileged container, host ports,
          # host networking or access to the operator's real DNS/certificates.
          docker run --detach --rm --name portico-ci-zitadel-tls \
            --user "$(id -u):$(id -g)" \
            --network ci-edge --network-alias mcp.example.invalid \
            --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --mount "type=bind,src=$lab,dst=/pki,readonly" \
            traefik:v3.6 \
            --entrypoints.secure.address=:443 \
            --providers.file.filename=/pki/traefik.yml \
            --api.dashboard=false --log.level=ERROR >/dev/null

          cat > "$lab/probe.py" <<'PY'
          import base64, json, os, ssl, time, urllib.error, urllib.parse, urllib.request

          base = "https://mcp.example.invalid/oauth/v2/introspect"
          client = json.load(open("/pki/introspection-app.json", encoding="utf-8"))
          token = json.load(open("/pki/probe-token.json", encoding="utf-8"))["access_token"]
          client_id, client_secret = client["clientId"], client["clientSecret"]
          secure_context = ssl.create_default_context(cafile="/pki/ca.pem")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          def opener(ctx):
              return urllib.request.build_opener(
                  urllib.request.HTTPSHandler(context=ctx),
                  urllib.request.ProxyHandler({}), NoRedirect())

          def request(bearer, client_secret_override=None, url=base):
              secret = client_secret if client_secret_override is None else client_secret_override
              credentials = base64.b64encode((client_id + ":" + secret).encode()).decode()
              body = urllib.parse.urlencode({"token": bearer}).encode()
              return urllib.request.Request(url, data=body, method="POST", headers={
                  "Authorization": "Basic " + credentials,
                  "Content-Type": "application/x-www-form-urlencoded"})

          trusted = opener(secure_context)
          for attempt in range(40):
              try:
                  with trusted.open(request("invalid-disposable-token"), timeout=4) as response:
                      assert response.status == 200, response.status
                      assert json.load(response).get("active") is False
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 39:
                      raise
                  time.sleep(2)

          with trusted.open(request(token), timeout=8) as response:
              assert response.status == 200
              actual = json.load(response)
              assert actual.get("active") is True
              assert actual.get("sub")
              assert actual.get("iss") == "https://mcp.example.invalid"
              assert actual.get("aud")
          try:
              trusted.open(request(token, client_secret_override="invalid-client-secret"), timeout=8)
              raise AssertionError("wrong introspection credentials were accepted")
          except urllib.error.HTTPError as exc:
              # ZITADEL v4 may return OAuth invalid_client as HTTP 400,
              # unlike the synthetic IDP's 401. Either must fail closed.
              assert exc.code in (400, 401), exc.code

          try:
              opener(ssl.create_default_context()).open(request(token), timeout=8)
              raise AssertionError("untrusted CA unexpectedly accepted")
          except (ssl.SSLError, urllib.error.URLError):
              pass

          try:
              trusted.open(request(token, url="https://portico-ci-zitadel-tls/oauth/v2/introspect"), timeout=8)
              raise AssertionError("incorrect TLS hostname unexpectedly accepted")
          except (ssl.SSLError, urllib.error.URLError):
              pass

          print("GATE_C_REAL_ZITADEL_TRUSTED_HTTPS_OK")
          PY
          docker run --rm --network ci-edge \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --mount "type=bind,src=$lab,dst=/pki,readonly" \
            python:3.12-slim-bookworm python3 /pki/probe.py

          # Exercise the exact distributed Gateway binary/image (not a fake
          # introspection client) against this real TLS-protected ZITADEL.
          # No privileged Broker, operator host mount or host port is needed.
          docker build --quiet --target gateway -t portico-gate-c-real-gateway:disposable . >/dev/null
          python3 - "$lab/gateway.env" <<'PY'
          import json, pathlib, sys
          identity=json.load(open("/tmp/introspection-app.json", encoding="utf-8"))
          project=json.load(open("/tmp/resource-project.json", encoding="utf-8"))["id"]
          settings={
              "VPS_AGENT_LISTEN":"0.0.0.0:8080",
              "VPS_AGENT_POC_ROOT":"/tmp/gate-c-local-root",
              "VPS_AGENT_AUTH_MODE":"integrated",
              "VPS_AGENT_OIDC_ISSUER":"https://mcp.example.invalid",
              "VPS_AGENT_PUBLIC_URL":"https://mcp.example.invalid/mcp",
              "VPS_AGENT_INTEGRATED_INTROSPECTION_URL":"https://mcp.example.invalid/oauth/v2/introspect",
              "VPS_AGENT_INTEGRATED_INTROSPECTION_CLIENT_ID":identity["clientId"],
              "VPS_AGENT_INTEGRATED_INTROSPECTION_CLIENT_SECRET":identity["clientSecret"],
              "VPS_AGENT_INTEGRATED_AUDIENCE_PROJECT_ID":project,
