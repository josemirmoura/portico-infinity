          for bearer in (None, "invalid-gate-c-token"):
              try:
                  opener.open(call(bearer),timeout=7)
                  raise AssertionError("unauthenticated Gateway tool call was accepted")
              except urllib.error.HTTPError as err:
                  assert err.code==401, err.code
                  assert "resource_metadata=" in err.headers.get("WWW-Authenticate","")
          print("GATE_C_REAL_GATEWAY_REAL_ZITADEL_TLS_OK")
          PY
          docker run --rm --network ci-edge \
