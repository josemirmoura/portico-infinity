          path.chmod(0o600)
          PY
          cp -p "$lab/migrate/.env" "$lab/original-legacy.env"
          (
            set -euo pipefail
            cd "$lab/migrate"
            # Explicitly override top-level Compose name to avoid all overlap.
            export COMPOSE_PROJECT_NAME=portico-gate-c-migration
            original_hash="$(sha256sum .env | cut -d ' ' -f1)"
